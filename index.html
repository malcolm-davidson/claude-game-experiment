<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover extends canvas into the notch/home-bar safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- iOS home-screen / standalone web-app hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Drakenrider</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        background: #0a0005;
        width: 100%;
        height: 100%;
        /* Prevent Safari rubber-band scroll */
        overflow: hidden;
        position: fixed;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        /* Respect iPhone notch / home-bar */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        /* Disable all default touch gestures on the canvas */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
